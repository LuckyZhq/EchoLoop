[project]
name = "ielts-study"
version = "0.1.0"
description = "IELTS listening and vocabulary practice from any video link"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argostranslate>=1.11.0",
    "deno>=2.9.8",
    "en-core-web-sm",
    "imageio-ffmpeg>=0.8.1",
    "mlx-whisper>=0.4.3",
    "opencc-python-reimplemented>=0.1.7",
    "spacy>=3.8.18",
    "yt-dlp[default]>=2026.10.26",
]

[project.scripts]
ielts-study = "ielts_study:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
