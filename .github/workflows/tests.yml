name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Windows runners can use a legacy code page for redirected output.
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # the offline dictionary (66 MB) is downloaded on first use; keep it between runs
      - uses: actions/cache@v4
        with:
          path: data/ecdict.csv
          key: ecdict-39cfb96
      - name: Download the dictionary if it isn't cached
        run: uv run python -c "from echoloop import dictionary as d; d.CSV_PATH.exists() or d.download_ecdict()"
      - run: uv run pytest -q
