<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章精读</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="workspace">
  <aside class="workspace-nav"></aside>
  <main class="wrap home-wrap">
    <header class="hero page-heading">
      <div>
        <h1 id="readingTitle">文章精读</h1>
        <p>按等级挑一篇读，或粘贴自己的文章。逐句翻译，标出重点短语和难词，点单词就能查。</p>
      </div>
    </header>

    <div class="tabs reading-tabs" id="tabs" role="tablist" aria-label="文章等级"></div>

    <section id="levelPanel" hidden>
      <p class="reading-level-hint" id="levelHint"></p>
      <div class="graded-grid" id="graded"></div>
      <form class="graded-write" id="writeForm" autocomplete="off">
        <div>
          <b>再来一篇</b>
          <span class="muted" id="writeHint">用你设置的 API 按这个等级写一篇新文章，话题可以不填。</span>
        </div>
        <div class="graded-write-row">
          <input id="topic" type="text" maxlength="80" placeholder="话题（英文或中文，例如 海洋塑料）" aria-label="话题">
          <button type="submit" class="btn primary" id="writeBtn">用 API 写一篇</button>
        </div>
        <div class="reading-job" id="writeJob" hidden></div>
        <div class="err" id="writeErr" role="status"></div>
      </form>
    </section>

    <section id="minePanel" hidden>
      <section class="import-panel" aria-label="粘贴文章">
        <form class="reading-form" id="form">
          <input id="title" type="text" maxlength="120" placeholder="标题（可不填）" aria-label="文章标题" autocomplete="off">
          <textarea id="text" rows="9" placeholder="在这里粘贴英文文章。段落之间空一行或换行即可。" aria-label="英文文章" spellcheck="false"></textarea>
          <div class="reading-actions">
            <span class="hint" id="engineHint"></span>
            <span class="hint" id="count"></span>
            <button type="submit" class="btn primary" id="go">开始精读 <span aria-hidden="true">→</span></button>
          </div>
        </form>
        <div class="err" id="formErr" role="status"></div>
        <div class="reading-job" id="job" hidden></div>
      </section>
      <div class="section-h"><h2>我的文章</h2><span class="muted" id="libCount"></span></div>
      <div class="article-list" id="list"></div>
    </section>
  </main>
</div>
<script src="/static/common.js"></script>
<script>
let graded = null, tab = null, engine = null;
const textBox = $("#text");
function updateCount() {
  const words = (textBox.value.match(/[A-Za-z][A-Za-z'’-]*/g) || []).length;
  $("#count").textContent = words ? `${words} 词` : "";
}
textBox.addEventListener("input", updateCount);

function savedTab() { try { return localStorage.getItem("readingTab"); } catch { return null; } }
function saveTab(id) { try { localStorage.setItem("readingTab", id); } catch { /* private mode */ } }

// The level is the reader's choice: the last tab they opened, else the first level.
function renderTabs() {
  const tabs = [...graded.levels.map(l => [l.id, l.label]), ["mine", "我的文章"]];
  if (!tabs.some(([id]) => id === tab)) tab = tabs[0][0];
  $("#tabs").innerHTML = tabs.map(([id, label]) =>
    `<button type="button" class="btn${id === tab ? " on" : ""}" role="tab" aria-selected="${id === tab}" data-tab="${esc(id)}">${esc(label)}</button>`).join("");
  $("#levelPanel").hidden = tab === "mine";
  $("#minePanel").hidden = tab !== "mine";
  if (tab === "mine") loadList(); else renderLevel();
}

function renderLevel() {
  const level = graded.levels.find(l => l.id === tab);
  const items = graded.articles.filter(a => a.level === tab).sort((a, b) => (a.ai - b.ai) || ((a.created || 0) - (b.created || 0)));
  $("#levelHint").textContent = `${level.hint} · ${items.length} 篇文章`;
  $("#graded").innerHTML = items.map(a => `
    <article class="graded-card${a.articleId ? " opened" : ""}">
      <button type="button" class="graded-open" data-open="${esc(a.id)}" data-article="${esc(a.articleId || "")}">
        <span class="graded-top">${a.topic ? `<span class="badge phrase">${esc(a.topic)}</span>` : ""}${a.ai ? `<span class="badge word">AI 写的</span>` : ""}</span>
        <b>${esc(a.title)}</b>
        <span class="graded-meta">${a.wordCount} 词 · ${a.articleId ? "读过" : "未读"}</span>
        <span class="graded-progress" hidden></span>
      </button>
      ${a.ai ? `<button type="button" class="iconbtn graded-del" data-del="${esc(a.articleId)}" aria-label="删除 ${esc(a.title)}">删除</button>` : ""}
    </article>`).join("");
  const api = engine && engine.engine === "api";
  $("#writeBtn").disabled = !api;
  $("#topic").disabled = !api;
  $("#writeHint").innerHTML = api
    ? `按这个等级写一篇新文章，话题可以不填。模型：${esc(MODEL_NAMES[engine.model] || engine.model)}`
    : `用 API 写新文章需要先<a href="/settings/translation">配置翻译 API</a>。`;
}

// Show a job's progress in `box` until it finishes; returns the article id.
async function follow(job, box) {
  box.hidden = false;
  while (job.stage !== "done" && job.stage !== "error") {
    const pct = job.stage === "annotate" ? 85 + job.percent * .15 : job.stage === "translate" ? 10 + job.percent * .75 : 5;
    box.innerHTML = `<b>${esc(job.stage === "translate" ? "翻译句子" : job.stageLabel)}</b> <span class="muted">${job.stage === "translate" || job.stage === "annotate" ? Math.round(job.percent) + "%" : ""}</span>
      <div class="recent-bar"><i style="width:${pct}%"></i></div>`;
    await new Promise(r => setTimeout(r, 800));
    job = await api(`/api/jobs/${job.id}`);
  }
  if (job.stage === "error") throw new Error(job.error || "处理失败");
  return job.videoId;
}

async function openPassage(btn) {
  if (btn.dataset.article) { location.href = `/reading/${encodeURIComponent(btn.dataset.article)}`; return; }
  if (btn.disabled) return;
  btn.disabled = true;
  const box = $(".graded-progress", btn);
  try {
    const out = await api("/api/graded/open", { method: "POST", body: { id: btn.dataset.open } });
    const aid = out.articleId || await follow(out.job, box);
    location.href = `/reading/${encodeURIComponent(aid)}`;
  } catch (e) {
    box.hidden = false;
    box.innerHTML = `<span class="err">${esc(e.message)}</span>`;
    btn.disabled = false;
  }
}

async function loadEngine() {
  try {
    engine = await api("/api/settings");
    $("#engineHint").innerHTML = engine.engine === "api"
      ? `翻译：${esc(engine.model)} · <a href="/settings/translation">更换</a>`
      : `翻译：本地（离线） · <a href="/settings/translation">改用 API</a>`;
  } catch { /* hint stays empty */ }
}

async function loadList() {
  const items = (await api("/api/reading")).filter(a => !a.level);
  $("#libCount").textContent = items.length ? `${items.length} 篇` : "";
  $("#list").innerHTML = items.length ? items.map(a => `
    <article class="article-item">
      <a class="article-link" href="/reading/${encodeURIComponent(a.id)}">
        <b>${esc(a.title)}</b>
        <span class="article-preview">${esc(a.preview)}</span>
        <span class="article-meta">${a.wordCount} 词 · ${a.sentenceCount} 句 · ${esc(translationLabel(a.translator, a.translatorModel, a.translator !== "local"))} · ${new Date(a.created * 1000).toLocaleDateString("zh-CN")}</span>
      </a>
      <button type="button" class="del iconbtn" data-id="${esc(a.id)}" aria-label="删除 ${esc(a.title)}">删除</button>
    </article>`).join("") : `<div class="empty">还没有自己的文章。粘贴一篇英文文章开始精读。</div>`;
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab]");
  if (t) { tab = t.dataset.tab; saveTab(tab); renderTabs(); return; }
  const o = e.target.closest("[data-open]");
  if (o) { openPassage(o); return; }
  const d = e.target.closest("[data-del], .del");
  if (d) {
    if (!confirm("确定删除这篇文章吗？已收藏的词句会保留。")) return;
    await api(`/api/reading/${encodeURIComponent(d.dataset.del || d.dataset.id)}`, { method: "DELETE" });
    if (d.dataset.del) { graded = await api("/api/graded"); renderLevel(); } else loadList();
  }
});

$("#writeForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("#writeErr").textContent = "";
  $("#writeBtn").disabled = true;
  try {
    const job = await api("/api/graded/generate", { method: "POST", body: { level: tab, topic: $("#topic").value } });
    const aid = await follow(job, $("#writeJob"));
    location.href = `/reading/${encodeURIComponent(aid)}`;
  } catch (error) {
    $("#writeJob").hidden = true;
    $("#writeErr").textContent = error.message;
    $("#writeBtn").disabled = false;
  }
});

$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  $("#formErr").textContent = "";
  const text = textBox.value.trim();
  if (!text) { $("#formErr").textContent = "请先粘贴英文文章。"; return; }
  $("#go").disabled = true;
  try {
    const job = await api("/api/reading", { method: "POST", body: { title: $("#title").value, text } });
    const aid = await follow(job, $("#job"));
    location.href = `/reading/${encodeURIComponent(aid)}`;
  } catch (error) {
    $("#job").hidden = true;
    $("#formErr").textContent = error.message;
    $("#go").disabled = false;
  }
});

(async () => {
  tab = savedTab();
  await loadEngine();
  try { graded = await api("/api/graded"); } catch (e) { toast(e.message); graded = { levels: [], articles: [] }; }
  renderTabs();
})();
</script>
</body>
</html>
