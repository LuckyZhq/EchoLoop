<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章精读</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="workspace">
  <aside class="workspace-nav"></aside>
  <main class="wrap article-wrap">
    <a class="back-link" href="/reading">← 文章列表</a>
    <header class="article-head">
      <h1 id="title">&nbsp;</h1>
      <p class="article-meta" id="meta"></p>
    </header>
    <div class="article-tools" role="toolbar" aria-label="阅读设置">
      <button type="button" class="btn" id="zhBtn" aria-pressed="false" title="逐句显示中文 (C)">中文对照</button>
      <button type="button" class="btn" id="marksBtn" aria-pressed="true" title="标出重点短语和难词 (M)">重点标注</button>
      <button type="button" class="btn" id="retranslate" title="用设置里的 API 模型重新翻译，并按单词和短语对照中文">↻ 重新翻译</button>
      <span class="hint">点单词查词、收藏；点句子末尾的「译」看这一句的中文。</span>
    </div>
    <article class="article-body" id="body"></article>
  </main>
</div>
<div class="pop" id="pop"></div>
<script src="/static/common.js"></script>
<script>
const aid = decodeURIComponent(location.pathname.split("/").pop());
let data = null, cues = [], saved = new Set();
let zhOn = storedFlag("readingZh");
let marksOn = readPreference("marks");

function render() {
  const paragraphs = [];
  for (const c of cues) (paragraphs[c.p] ||= []).push(c);
  const body = $("#body");
  body.classList.toggle("zh-on", zhOn);
  body.classList.toggle("no-marks", !marksOn);
  // 中文对照: each word or phrase gets its Chinese underneath (same layout as the video captions).
  const enHtml = c => {
    const marks = marksOn ? visibleMarks(c) : [];
    const layered = zhOn && (Array.isArray(c.gl) || Array.isArray(c.seg));
    return `<span class="sent-en${layered ? " interlinear" : ""}">${layered ? renderInterlinear(c.text, marks, c.gl, c.seg) : renderMarked(c.text, marks)}</span>`;
  };
  body.innerHTML = paragraphs.filter(Boolean).map(sents => `<div class="para">${sents.map(c => `
    <span class="sent" id="s${c.i}" data-i="${c.i}">${enHtml(c)}` +
      `<button type="button" class="sent-tr" data-tr="${c.i}" title="看这一句的中文">译</button>` +
      `<span class="sent-zh">${esc(c.zh || "")}</span></span>`).join(" ")}</div>`).join("");
  $("#zhBtn").setAttribute("aria-pressed", zhOn);
  $("#zhBtn").classList.toggle("on", zhOn);
  $("#marksBtn").setAttribute("aria-pressed", marksOn);
  $("#marksBtn").classList.toggle("on", marksOn);
}

// ---------- popover: word / phrase card, or one sentence's translation
const pop = $("#pop");
function showPop(anchor, html) {
  pop.innerHTML = html;
  pop.classList.add("show");
  const r = anchor.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  const x = Math.min(Math.max(16, r.left + r.width / 2 - pw / 2), innerWidth - pw - 16);
  let y = r.bottom + 8;
  if (y + ph > innerHeight - 8) y = r.top - ph - 8;
  pop.style.left = x + "px"; pop.style.top = Math.max(8, y) + "px";
}
function hidePop() { pop.classList.remove("show"); }

function noteHtml(n, c) {
  const isSaved = saved.has(n.en.toLowerCase());
  const key = (n.type === "phrase" ? "p:" : "w:") + n.en;
  return `<div class="note ${n.type}" style="border:0;padding:0">
    <div class="h"><b>${esc(n.en)}</b>${n.phonetic ? `<span class="ph">/${esc(n.phonetic)}/</span>` : ""}
      <span class="badge ${n.type}">${n.type === "phrase" ? "重点短语" : n.lookup ? "查词" : "难词"}</span>
      <span class="act">
        <button class="iconbtn" data-speak="${esc(n.en)}" title="发音">🔊</button>
        <button class="iconbtn ${isSaved ? "saved" : ""}" data-save="${esc(key)}" data-cue="${c.i}">${isSaved ? "★ 已收藏" : "☆ 收藏"}</button>
      </span></div>
    <div class="zh">${esc(n.zh)}</div>
    ${n.note ? `<div class="tip">${esc(n.note)}</div>` : ""}
  </div>`;
}

const lookups = new Map();  // "w:word" → note for words looked up in the dictionary
async function lookupNote(w) {
  const info = await api(`/api/lookup?w=${encodeURIComponent(w)}`);
  const n = { type: "word", lookup: true, en: info.en || w, zh: info.zh || "（词典里没有找到）", phonetic: info.phonetic || "", note: "" };
  lookups.set("w:" + n.en, n);
  return n;
}

async function toggleSave(btn) {
  const key = btn.dataset.save, c = cues[+btn.dataset.cue];
  const n = c.notes?.[key] || lookups.get(key) || await lookupNote(key.slice(2));
  const k = n.en.toLowerCase();
  if (saved.has(k)) {
    await api(`/api/vocab/${encodeURIComponent(k)}`, { method: "DELETE" });
    saved.delete(k); toast("已取消收藏");
  } else {
    await api("/api/vocab", { method: "POST", body: { ...n, key, sentence: c.text, sentenceZh: c.zh, articleId: aid, sentenceIndex: c.i } });
    saved.add(k); toast("已收藏");
  }
  $$(`[data-save="${CSS.escape(key)}"]`).forEach(b => { const on = saved.has(k); b.classList.toggle("saved", on); b.textContent = on ? "★ 已收藏" : "☆ 收藏"; });
}

document.addEventListener("click", async e => {
  const sp = e.target.closest("[data-speak]");
  if (sp) { e.stopPropagation(); speak(sp.dataset.speak); return; }
  const sv = e.target.closest("[data-save]");
  if (sv) { e.stopPropagation(); return toggleSave(sv); }
  const tr = e.target.closest("[data-tr]");
  if (tr) {
    const c = cues[+tr.dataset.tr];
    showPop(tr, `<div class="note" style="border:0;padding:0"><div class="h"><span class="muted">第 ${c.i + 1} 句</span>
      <span class="act"><button class="iconbtn" data-speak="${esc(c.text)}" title="朗读这一句">🔊 朗读</button></span></div>
      <div class="zh">${esc(c.zh || "（没有译文）")}</div></div>`);
    return;
  }
  const word = e.target.closest(".article-body .w, .article-body mark");
  if (word) {
    const c = cues[+word.closest(".sent").dataset.i];
    if (word.tagName === "MARK") {
      const n = c.notes?.[word.dataset.key];
      if (n) showPop(word, noteHtml(n, c));
      return;
    }
    showPop(word, noteHtml(await lookupNote(word.dataset.w), c));
    return;
  }
  if (!e.target.closest(".pop")) hidePop();
});

function showMeta() {
  const words = cues.reduce((n, c) => n + (c.text.match(/[A-Za-z][A-Za-z'’-]*/g) || []).length, 0);
  const marks = cues.reduce((n, c) => n + visibleMarks(c).length, 0);
  const aligned = cues.some(c => c.seg && c.seg.length);
  const how = data.translator === "local" ? "本地翻译" : aligned ? "API 短语对照" : "API 翻译";
  $("#meta").textContent = `${words} 词 · ${cues.length} 句 · ${marks} 处重点 · ${how}`;
}

// ---------- 重新翻译 with the API model (phrase by phrase)
async function retranslate() {
  const btn = $("#retranslate");
  let settings;
  try { settings = await api("/api/settings"); } catch (e) { toast(e.message); return; }
  if (settings.engine !== "api") {
    if (confirm("重新翻译需要 API 模型，现在用的是本地翻译。要去设置里选择模型吗？")) location.href = "/settings/translation";
    return;
  }
  if (!confirm(`用 ${settings.model} 重新翻译这篇文章的 ${cues.length} 句，并按单词、短语对照中文？\n会按服务商价格计费。`)) return;
  btn.disabled = true;
  try {
    let job = await api(`/api/reading/${encodeURIComponent(aid)}/retranslate`, { method: "POST" });
    while (job.stage !== "done" && job.stage !== "error") {
      btn.textContent = job.stage === "queued" ? "排队中…" : `翻译中 ${Math.round(job.percent)}%`;
      await new Promise(r => setTimeout(r, 1000));
      job = await api(`/api/jobs/${job.id}`);
    }
    if (job.stage === "error") throw new Error(job.error || "重新翻译失败");
    data = await api(`/api/reading/${encodeURIComponent(aid)}`);
    cues = data.cues;
    showMeta();
    render();
    toast("已重新翻译");
  } catch (e) {
    alert(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "↻ 重新翻译";
  }
}
$("#retranslate").onclick = retranslate;

function setZh(on) { zhOn = on; storeFlag("readingZh", on); render(); }
$("#zhBtn").onclick = () => setZh(!zhOn);
$("#marksBtn").onclick = () => { marksOn = !marksOn; render(); };
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest("input, textarea")) return;
  if (e.key === "c" || e.key === "C") setZh(!zhOn);
  if (e.key === "m" || e.key === "M") { marksOn = !marksOn; render(); }
  if (e.key === "Escape") hidePop();
});
window.addEventListener("storage", event => { if (event.key === null || event.key === "vocabLevel") render(); });

(async () => {
  try { data = await api(`/api/reading/${encodeURIComponent(aid)}`); }
  catch { $("#body").innerHTML = `<p>找不到这篇文章。<a href="/reading">返回文章列表</a></p>`; return; }
  cues = data.cues;
  document.title = data.title;
  $("#title").textContent = data.title;
  showMeta();
  render();
  const vocab = await api("/api/vocab").catch(() => []);
  saved = new Set(vocab.map(v => v.en.toLowerCase()));
  const target = location.hash && document.getElementById(location.hash.slice(1));
  if (target) { target.scrollIntoView({ block: "center" }); target.classList.add("flash"); }
})();
</script>
</body>
</html>
