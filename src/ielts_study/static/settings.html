<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="workspace">
  <aside class="workspace-nav"></aside>
  <main class="wrap settings-wrap">
    <header class="hero"><h1>设置</h1><p>按你的学习习惯调整外观、播放和 API。所有设置都只保存在这台电脑上。</p></header>
    <div class="settings-layout">
      <nav class="settings-index" aria-label="设置分类">
        <a href="/settings/appearance"><b>外观</b><small>语言、主题、字幕字号</small></a>
        <a href="/settings/download"><b>下载</b><small>视频清晰度</small></a>
        <a href="/settings/storage"><b>存储</b><small>视频占用的空间</small></a>
        <a href="/settings/playback"><b>播放</b><small>倍速、字幕和高亮</small></a>
        <a href="/settings/study"><b>学习</b><small>雅思词汇水平</small></a>
        <a href="/settings/translation"><b>API</b><small>服务商和模型</small></a>
        <a href="/settings/speech"><b>语音识别</b><small>本地模型大小、云端识别</small></a>
        <a href="/settings/devices"><b>手机访问</b><small>同一个 Wi-Fi 下用手机复习</small></a>
        <a href="/settings/backup"><b>备份</b><small>导出、恢复、自动备份</small></a>
      </nav>
      <div class="settings-content"></div>
      <template id="page-appearance">
        <section class="settings-section" id="appearance" aria-labelledby="appearanceTitle">
          <h2 id="appearanceTitle">外观</h2>
          <p class="settings-lead">界面语言、颜色和学习文字的大小。</p>
          <div class="settings-row">
            <label class="settings-label" for="uiLang"><span>界面语言</span><small>按钮、菜单和提示文字的语言</small></label>
            <span class="select-wrap wide"><select class="btn" id="uiLang"></select></span>
          </div>
          <div class="settings-row">
            <label class="settings-label" for="nativeLang"><span>母语</span><small>字幕、短语和单词释义翻译成这种语言。简体和繁体之间马上切换；换成其他语言后，已导入的视频点「重新翻译」即可</small></label>
            <span class="select-wrap wide"><select class="btn" id="nativeLang"></select></span>
          </div>
          <div class="settings-row">
            <label class="settings-label" for="theme"><span>界面主题</span><small>选「跟随系统」时会随 macOS 的浅色、深色自动切换</small></label>
            <span class="select-wrap"><select class="btn" id="theme" data-preference="appearance"></select></span>
          </div>
          <div class="settings-row stack">
            <label class="settings-label" for="textSize"><span>字幕字号</span><small>视频字幕、逐句原文、听写和错句本；点百分比恢复默认</small></label>
            <span class="range-wrap">
              <span class="range-end small" aria-hidden="true">A</span>
              <input type="range" id="textSize" data-preference="textSize" min="0.8" max="1.8" step="0.05">
              <span class="range-end big" aria-hidden="true">A</span>
              <button type="button" class="range-value" id="textSizeValue" title="恢复默认大小"></button>
            </span>
          </div>
          <div class="text-preview" aria-hidden="true">
            <div class="text-preview-label">预览</div>
            <div class="caption"><div class="en">I swear listening to podcasts is going to <mark class="phrase">improve</mark> your English.</div><div class="zh">我发誓听播客会提高你的英语水平。</div></div>
          </div>
          <p class="settings-help">整个页面要放大缩小，可以用浏览器的 ⌘+ / ⌘−。</p>
        </section>
      </template>

      <template id="page-download">
        <section class="settings-section" id="download" aria-labelledby="downloadTitle">
          <h2 id="downloadTitle">下载</h2>
          <p class="settings-lead">导入视频时下载的画质。不影响字幕和翻译。</p>
          <div class="settings-row">
            <label class="settings-label" for="downloadQuality"><span>视频清晰度上限</span><small>越高画面越清楚，文件也越大；720p 适合大多数学习场景</small></label>
            <span class="select-wrap"><select class="btn" id="downloadQuality" data-preference="quality"></select></span>
          </div>
          <p class="settings-help" id="qualityHint" hidden>YouTube 的 1440p 及以上不提供 H.264 编码，会下载 VP9 或 AV1。Chrome 可以正常播放，Safari 可能无法播放。</p>
        </section>
      </template>

      <template id="page-storage">
        <section class="settings-section" id="storage" aria-labelledby="storageTitle">
          <h2 id="storageTitle">存储</h2>
          <p class="settings-lead">视频文件占了资料库的大部分空间。听力练习用 720p 就够清楚；只做听写的话，可以只保留音频。字幕、翻译、听写记录和收藏都不受影响。</p>
          <div class="storage-total" id="storageTotal">正在统计…</div>
          <div class="storage-list" id="storageList"></div>
          <p class="settings-help">压缩用 Mac 的硬件编码，不会占满 CPU。新文件生成完、确认变小后才会替换原视频；压缩不能撤销。</p>
        </section>
      </template>

      <template id="page-playback">
        <section class="settings-section" id="playback" aria-labelledby="playbackTitle">
          <h2 id="playbackTitle">播放</h2>
          <p class="settings-lead">打开视频时的默认状态。播放器里用快捷键可以临时切换。</p>
          <div class="settings-row">
            <label class="settings-label" for="playbackSpeed"><span>默认倍速</span><small>听不清时可以先用 0.75× 精听</small></label>
            <span class="select-wrap"><select class="btn" id="playbackSpeed" data-preference="speed"></select></span>
          </div>
          <div class="settings-row">
            <label class="settings-label" for="ttsEngine"><span>朗读声音</span><small id="ttsState">神经语音在本机生成，听起来接近真人录音；第一次使用时下载模型（约 165 MB）</small></label>
            <span class="settings-inline">
              <button type="button" class="btn" id="ttsDownload" hidden>下载</button>
              <span class="select-wrap"><select class="btn" id="ttsEngine" data-preference="ttsEngine"></select></span>
            </span>
          </div>
          <div class="settings-row">
            <label class="settings-label" for="voiceAccent"><span>朗读口音</span><small id="voiceName">今日复习、错句本和文章里的朗读用这个口音。雅思录音以英式为主，四六级以美式为主</small></label>
            <span class="settings-inline">
              <button type="button" class="btn" id="voiceTry">▶ 试听</button>
              <span class="select-wrap"><select class="btn" id="voiceAccent" data-preference="voice"></select></span>
            </span>
          </div>
          <label class="settings-row"><span class="settings-label"><span>显示中文字幕</span><small>播放器里按 C 临时切换</small></span><input type="checkbox" role="switch" class="settings-switch" data-preference="zh"></label>
          <label class="settings-row"><span class="settings-label"><span>高亮重点词句</span><small>重点短语和难词的底色，按 M 临时切换</small></span><input type="checkbox" role="switch" class="settings-switch" data-preference="marks"></label>
          <label class="settings-row"><span class="settings-label"><span>字幕跟随播放</span><small>右侧逐句原文自动滚到正在播放的那句</small></span><input type="checkbox" role="switch" class="settings-switch" data-preference="follow"></label>
          <label class="settings-row"><span class="settings-label"><span>逐词中文释义</span><small>视频字幕里每个英文单词下面显示简短中文，按 G 临时切换</small></span><input type="checkbox" role="switch" class="settings-switch" data-preference="gloss"></label>
          <label class="settings-row"><span class="settings-label"><span>高亮正在读的单词</span><small>播放时标出读到哪个词</small></span><input type="checkbox" role="switch" class="settings-switch" data-preference="karaoke"></label>
          <div class="settings-row">
            <label class="settings-label" for="nowColor"><span>朗读高亮颜色</span><small>正在读的那个单词的底色</small></label>
            <span class="select-wrap"><select class="btn" id="nowColor" data-preference="nowColor"></select></span>
          </div>
          <label class="settings-row"><span class="settings-label"><span>逐句暂停</span><small>每句播完自动暂停，适合跟读，按 P 临时切换</small></span><input type="checkbox" role="switch" class="settings-switch" data-preference="autoPause"></label>
          <label class="settings-row"><span class="settings-label"><span>单句循环</span><small>反复播放当前这一句，按 L 临时切换</small></span><input type="checkbox" role="switch" class="settings-switch" data-preference="loop"></label>
        </section>
      </template>

      <template id="page-study">
        <section class="settings-section" id="study" aria-labelledby="studyTitle">
          <h2 id="studyTitle">学习</h2>
          <p class="settings-lead">决定播放器里标出哪些难词。改了之后所有视频立即生效，不用重新导入。</p>
          <div class="settings-row">
            <div class="settings-label"><span>现在的水平和目标</span><small id="levelSummary">只标出比你现在水平难、又不超出目标太多的词</small></div>
            <a class="btn" href="/level">测试 / 调整</a>
          </div>
        </section>
      </template>

      <template id="page-speech">
        <section class="settings-section" id="speech" aria-labelledby="speechTitle">
          <h2 id="speechTitle">语音识别</h2>
          <p class="settings-lead">视频没有字幕时，以及口语练习的录音，都用这里选的方式转成英文。</p>
          <div class="settings-row">
            <label class="settings-label" for="asrEngine"><span>识别方式</span><small>本地识别不联网；云端识别更快，没有显卡的电脑也能用大模型，连不上时自动改用本地</small></label>
            <span class="select-wrap wide"><select class="btn" id="asrEngine"><option value="local">本地</option><option value="cloud">云端</option></select></span>
          </div>
          <div class="settings-row">
            <label class="settings-label" for="asrModel"><span>本地模型</span><small id="asrModelHint"></small></label>
            <span class="settings-inline">
              <button type="button" class="btn" id="asrDownload" hidden>下载</button>
              <span class="select-wrap wide"><select class="btn" id="asrModel"></select></span>
            </span>
          </div>
          <div class="asr-sizes" id="asrSizes"></div>
          <form id="cloudForm" class="cloud-form" hidden>
            <h3>云端识别</h3>
            <div class="settings-grid">
              <label class="settings-field" for="cloudProvider"><span>服务商</span>
                <span class="select-wrap"><select id="cloudProvider"></select></span></label>
              <label class="settings-field" for="cloudModel"><span>模型</span>
                <input id="cloudModel" type="text" maxlength="200" spellcheck="false" autocapitalize="none"></label>
              <label class="settings-field span-2" for="cloudUrl"><span>API 地址</span>
                <input id="cloudUrl" type="url" maxlength="2048" spellcheck="false" autocapitalize="none"></label>
              <label class="settings-field span-2" for="cloudKey"><span>API Key</span>
                <input id="cloudKey" type="password" maxlength="4096" autocomplete="off" spellcheck="false">
                <small id="cloudKeyHint">密钥保存在这台电脑上。</small>
                <a id="cloudConsole" target="_blank" rel="noopener noreferrer" hidden>获取 API Key ↗</a></label>
            </div>
            <p class="settings-help">需要支持逐词时间的 OpenAI 兼容接口，例如 OpenAI 的 whisper-1 或 Groq 的 whisper-large-v3-turbo。音频会压缩成小的 MP3 分段上传给你选的服务商。</p>
            <div class="settings-actions"><button type="submit" class="btn primary">保存云端识别设置</button></div>
          </form>
          <p id="asrStatus" class="settings-status" role="status" aria-live="polite"></p>
        </section>
      </template>

      <template id="page-devices">
        <section class="settings-section" id="devices" aria-labelledby="devicesTitle">
          <h2 id="devicesTitle">手机访问</h2>
          <p class="settings-lead">手机和电脑连同一个 Wi-Fi，就能在手机浏览器里复习单词、听写、读文章。电脑需要开着 IELTS Study。</p>
          <label class="settings-row"><span class="settings-label"><span>允许同一个 Wi-Fi 里的手机访问</span><small>打开后需要重启一次。只有扫过二维码（带访问密钥）的手机能打开，API Key、备份和这些设置仍然只能在电脑上改</small></span><input type="checkbox" role="switch" class="settings-switch" id="lanSwitch"></label>
          <div class="lan-box" id="lanBox" hidden>
            <img id="lanQr" alt="用手机相机扫描这个二维码" width="220" height="220">
            <div>
              <b>用手机相机扫描二维码</b>
              <p class="muted">或者在手机浏览器里打开：</p>
              <code id="lanUrl"></code>
              <p class="muted" id="lanOthers" hidden></p>
              <p class="muted">口语练习需要麦克风，手机浏览器只允许 HTTPS 页面录音，所以口语请在电脑上练。第一次打开时，电脑可能会询问是否允许传入连接，请选择允许。</p>
              <button type="button" class="btn" id="lanNewKey">换一个访问密钥</button>
            </div>
          </div>
          <div class="restart-note" id="lanRestart" hidden>
            <span>重启后生效</span><button type="button" class="btn primary" id="lanRestartBtn">立即重启</button>
          </div>
          <p id="lanStatus" class="settings-status" role="status" aria-live="polite"></p>
        </section>
      </template>

      <template id="page-backup">
        <section class="settings-section" id="backup" aria-labelledby="backupTitle">
          <h2 id="backupTitle">备份</h2>
          <p class="settings-lead">收藏的词句、复习进度、错句本、听写成绩、文章、口语和作文记录都在资料库里。备份不含 API Key；视频文件很大，默认不放进备份。</p>
          <div class="settings-row">
            <div class="settings-label"><span>导出备份</span><small>下载一个 zip 文件，换电脑时在新电脑上恢复</small></div>
            <span class="settings-inline">
              <label class="settings-check"><input type="checkbox" id="withVideos"> 包含视频</label>
              <a class="btn" id="exportBtn" href="/api/backup/export" download>下载备份</a>
            </span>
          </div>
          <div class="settings-row">
            <div class="settings-label"><span>从备份恢复</span><small>用备份里的文件替换现在的同名文件；被替换的文件会先另存一份，不会丢</small></div>
            <span class="settings-inline">
              <input type="file" id="restoreFile" accept=".zip,application/zip" hidden>
              <button type="button" class="btn" id="restoreBtn">选择备份文件…</button>
            </span>
          </div>
          <form class="cloud-form" id="autoForm">
            <h3>每天自动备份到文件夹</h3>
            <p class="settings-help">选一个会同步到网盘的文件夹（iCloud Drive、OneDrive、Dropbox、坚果云等），电脑开着 IELTS Study 时每天备份一次，保留最近几份。</p>
            <div class="backup-suggest" id="backupSuggest"></div>
            <div class="settings-grid">
              <label class="settings-field span-2" for="backupFolder"><span>文件夹</span>
                <input id="backupFolder" type="text" placeholder="文件夹的完整路径，可以点上面的同步文件夹" spellcheck="false" autocapitalize="none"></label>
              <label class="settings-field" for="backupKeep"><span>保留份数</span>
                <input id="backupKeep" type="number" min="1" max="60"></label>
            </div>
            <p class="muted" id="backupLast"></p>
            <div class="settings-actions">
              <button type="button" class="btn" id="backupNow">立即备份</button>
              <button type="submit" class="btn primary">保存</button>
            </div>
          </form>
          <p id="backupStatus" class="settings-status" role="status" aria-live="polite"></p>
        </section>
      </template>

      <template id="page-translation">
        <form id="translation" class="settings-section" aria-labelledby="translationTitle">
          <h2 id="translationTitle">API</h2>
          <p class="settings-lead">选择导入视频时使用的字幕翻译服务。</p>
          <fieldset id="settingsControls" disabled>
            <fieldset id="providerPicker" class="provider-picker">
              <legend class="visually-hidden">服务商</legend>
              <section class="provider-box" aria-labelledby="ownedTitle">
                <div class="provider-box-head"><h3 id="ownedTitle">已拥有</h3><small>点一下就切换，不用再填写。</small></div>
                <div id="ownedProviders" class="provider-options"></div>
              </section>
              <section class="provider-box" aria-labelledby="otherTitle">
                <div class="provider-box-head"><h3 id="otherTitle">未拥有</h3><small>选择后填写 API Key，保存后会移到「已拥有」。</small></div>
                <div id="otherProviders" class="provider-options"></div>
              </section>
            </fieldset>

            <div id="providerForm" class="provider-form" hidden>
            <div id="apiFields" class="settings-grid">
              <label class="settings-field" for="baseUrl">
                <span>API 地址</span>
                <input id="baseUrl" type="url" placeholder="https://api.example.com/v1" maxlength="2048" spellcheck="false" autocapitalize="none">
              </label>
              <label class="settings-field span-2" for="apiKey">
                <span>API Key</span>
                <input id="apiKey" type="password" placeholder="服务商需要时填写" maxlength="4096" autocomplete="off" spellcheck="false" aria-describedby="keyHint">
                <small id="keyHint">密钥保存在这台电脑上。</small>
                <a id="providerConsole" target="_blank" rel="noopener noreferrer" hidden>获取 API Key ↗</a>
              </label>
              <label id="removeKey" class="settings-check span-2" hidden><input type="checkbox" id="clearKey"> 保存时移除已保存的密钥</label>
              <div class="settings-field">
                <label id="modelLabel" for="model">模型名称</label>
                <span id="modelPicker" class="select-wrap" hidden>
                  <select id="modelSelect" aria-labelledby="modelLabel" aria-describedby="modelHint"></select>
                </span>
                <input id="model" type="text" placeholder="填写服务商提供的模型 ID" maxlength="200" spellcheck="false" autocapitalize="none" aria-labelledby="modelLabel" aria-describedby="modelHint">
                <small id="modelHint" role="status"></small>
              </div>
            </div>

            <p class="settings-help" id="externalHelp">测试连接会发送一条示例。翻译时只发送英文字幕文本。</p>
            <div class="settings-actions">
              <button type="button" id="cancelEdit" class="btn ghost" hidden>收起</button>
              <button type="button" id="testApi" class="btn">测试连接</button>
              <button type="submit" class="btn primary">保存 API 设置</button>
            </div>
            </div>
          </fieldset>
          <p id="settingsStatus" class="settings-status" role="status" aria-live="polite"></p>
        </form>
      </template>
    </div>
  </main>
</div>

<script src="/static/common.js"></script>
<script>
const settingsLinks = $$(".settings-index a");
const currentPath = location.pathname.replace(/\/+$/, "");
const oldSection = location.hash.slice(1);
const requestedPath = currentPath === "/settings"
  ? "/settings/" + (oldSection === "agent" ? "translation" : oldSection)
  : currentPath;
const activeLink = settingsLinks.find(link => link.pathname === requestedPath) || settingsLinks[0];
const section = activeLink.pathname.split("/").pop();
activeLink.setAttribute("aria-current", "page");
document.title = (activeLink.querySelector("b") || activeLink).textContent + " · 设置";
$(".settings-content").append($("#page-" + section).content.cloneNode(true));
if (location.pathname !== activeLink.pathname || location.hash) {
  history.replaceState(history.state, "", activeLink.pathname + location.search);
}

const preferenceControls = $$("[data-preference]");
function showPreference(control) {
  const value = readPreference(control.dataset.preference);
  if (control.type === "checkbox") control.checked = value;
  else control.value = value;
  if (control.dataset.preference === "textSize") {
    const percent = Math.round(Number(value) * 100) + "%";
    control.setAttribute("aria-valuetext", percent);
    $("#textSizeValue").textContent = percent;
    $("#textSizeValue").classList.toggle("is-default", value === "1");
  }
  if (control.dataset.preference === "quality") {
    $("#qualityHint").hidden = !["1440", "2160", "best"].includes(value);
  }
}

for (const control of preferenceControls) {
  const name = control.dataset.preference;
  const options = preferenceOptions[name];
  if (options) control.replaceChildren(...options.map(([value, label]) => new Option(label, value)));
  showPreference(control);
  if (control.type === "range") {
    // Live update while dragging; the "change" handler below saves and confirms on release.
    control.addEventListener("input", () => {
      try { localStorage.setItem(name, control.value); } catch {}
      applyAppearance();
      showPreference(control);
    });
  }
  control.addEventListener("change", () => {
    const value = control.type === "checkbox" ? (control.checked ? "1" : "0") : control.value;
    try {
      localStorage.setItem(name, value);
      if (name === "appearance" || name === "textSize" || name === "nowColor") applyAppearance();
      toast("偏好已保存");
    } catch {
      toast("无法保存偏好");
    }
    showPreference(control);
  });
}
window.addEventListener("pageshow", () => preferenceControls.forEach(showPreference));

// 朗读口音: say which voice will be used, and let it be heard.
if ($("#voiceTry")) {
  const NEURAL_NAMES = { uk: "Kokoro · Emma（英式女声）", "uk-male": "Kokoro · George（英式男声）", us: "Kokoro · Heart（美式女声）" };
  let timer = null;
  const showEngine = async () => {
    clearTimeout(timer);
    let s;
    try { s = await api("/api/tts/status"); } catch { return; }
    ttsState = s;
    const neural = readPreference("ttsEngine") === "neural";
    $("#ttsDownload").hidden = !neural || !(s.status === "missing" || s.status === "error");

const storageList = $("#storageList");
if (storageList) {
  // an array, not an object: number-like keys would be reordered (480 before 720)
  const SHRINK_OPTIONS = [["720", "压缩到 720p"], ["480", "压缩到 480p"], ["audio", "只保留音频"]];
  const SHRINK = Object.fromEntries(SHRINK_OPTIONS);
  async function loadStorage() {
    const s = await api("/api/storage");
    $("#storageTotal").innerHTML = `<b>${fmtBytes(s.libraryBytes + s.articleBytes)}</b><span>其中视频 ${fmtBytes(s.videoBytes)} · ${s.videos.length} 个</span>`;
    storageList.innerHTML = s.videos.length ? s.videos.map(v => {
      const options = SHRINK_OPTIONS.filter(([mode]) => mode === "audio" ? !v.audioOnly : v.height > +mode);
      return `<div class="storage-item" data-id="${esc(v.id)}">
        <div class="storage-info">
          <a href="/player/${encodeURIComponent(v.id)}" class="storage-title">${esc(v.title)}</a>
          <span class="storage-meta">${v.audioOnly ? "只有音频" : `${v.height}p`} · ${fmtTime(v.duration)}</span>
        </div>
        <b class="storage-size">${fmtBytes(v.bytes)}</b>
        <div class="storage-actions">${options.length
          ? options.map(([mode, label]) => `<button type="button" class="btn" data-shrink="${mode}">${label}</button>`).join("")
          : `<span class="storage-meta">已经很小了</span>`}</div>
      </div>`;
    }).join("") : `<div class="empty">还没有视频。</div>`;
  }
  storageList.addEventListener("click", async event => {
    const btn = event.target.closest("[data-shrink]");
    if (!btn) return;
    const item = btn.closest(".storage-item");
    const mode = btn.dataset.shrink;
    const title = $(".storage-title", item).textContent;
    const warn = mode === "audio" ? "播放器里将只有声音、没有画面。" : "画面会变得没那么清楚。";
    if (!(await confirmDialog(`「${title}」${SHRINK[mode]}？`, { detail: `${warn}这一步不能撤销。`, ok: "压缩", danger: true }))) return;
    $$("button", item).forEach(b => { b.disabled = true; });
    try {
      let job = await api(`/api/video/${encodeURIComponent(item.dataset.id)}/shrink`, { method: "POST", body: { mode } });
      while (job.stage !== "done" && job.stage !== "error") {
        btn.textContent = job.stage === "queued" ? "排队中…" : `压缩中 ${Math.round(job.percent)}%`;
        await new Promise(r => setTimeout(r, 800));
        job = await api(`/api/jobs/${job.id}`);
      }
      if (job.stage === "error") throw new Error(job.error || "压缩失败");
      toast(`已压缩：${fmtBytes(job.result.before)} → ${fmtBytes(job.result.after)}`);
    } catch (error) {
      alertDialog(error.message);
    }
    loadStorage();
  });
  loadStorage().catch(error => { $("#storageTotal").textContent = error.message; });
}

const form = $("#translation");
if (form) {
  const controls = $("#settingsControls");
  const providerPicker = $("#providerPicker");
  const ownedProviders = $("#ownedProviders");
  const otherProviders = $("#otherProviders");
  const baseUrl = $("#baseUrl");
  const apiKey = $("#apiKey");
  const model = $("#model");
  const modelSelect = $("#modelSelect");
  const modelPicker = $("#modelPicker");
  const modelHint = $("#modelHint");
  const clearKey = $("#clearKey");
  let savedSettings;
  let provider;
  let modelsRequest;
  let modelsTimer;
  let keepModel = false;
  let committedAddress = "";

  function showMessage(message, error = false) {
    const status = $("#settingsStatus");
    status.textContent = message;
    status.classList.toggle("err", error);
  }

  function normalizeAddress(value) {
    return value.trim().replace(/\/+$/, "").replace(/\/chat\/completions$/, "").replace(/\/+$/, "");
  }

  function showModelInput(manual) {
    model.hidden = !manual;
    $("#modelLabel").htmlFor = manual ? "model" : "modelSelect";
  }

  function resetModelPicker() {
    clearTimeout(modelsTimer);
    modelsRequest?.abort();
    modelsRequest = null;
    modelPicker.hidden = true;
    showModelInput(true);
    modelHint.textContent = "";
  }

  async function refreshModels() {
    resetModelPicker();
    if (!provider) return;
    const address = normalizeAddress(baseUrl.value);
    if (!address || !baseUrl.validity.valid) {
      modelHint.textContent = "填写有效的 API 地址后可自动获取模型。";
      return;
    }
    const key = apiKey.value.trim();
    const canUseSavedKey = provider.hasApiKey && address === normalizeAddress(provider.baseUrl) && !clearKey.checked;
    if (clearKey.checked || (!key && !canUseSavedKey && provider.id !== "custom")) {
      modelHint.textContent = "填写 API Key 后可自动获取模型。";
      return;
    }

    const request = new AbortController();
    modelsRequest = request;
    modelHint.textContent = "正在获取模型…";
    try {
      const {models} = await api("/api/settings/models", {
        method: "POST",
        body: {provider: provider.id, baseUrl: address, apiKey: key},
        signal: request.signal,
      });
      if (request.signal.aborted) return;
      if (!models.length) {
        modelHint.textContent = "未找到可用于字幕翻译的文本模型。可以手动填写模型 ID。";
        return;
      }
      const placeholder = new Option("选择一个模型", "");
      placeholder.disabled = true;
      const manual = new Option("手动输入模型 ID…", "");
      modelSelect.replaceChildren(placeholder, ...models.map(({id, name}) => new Option(
        name && name.toLowerCase() !== id.toLowerCase() ? `${name} · ${id}` : id, id
      )), manual);
      const matches = models.some(({id}) => id === model.value.trim());
      const keepManual = !matches && keepModel && Boolean(model.value.trim());
      if (keepManual) manual.selected = true;
      else modelSelect.value = matches ? model.value.trim() : "";
      if (!keepManual) model.value = modelSelect.value;
      modelPicker.hidden = false;
      showModelInput(keepManual);
      modelHint.textContent = keepManual
        ? "当前模型未出现在列表中。可以保留手动输入，或从列表重新选择。"
        : `已筛出 ${models.length} 个文本模型。`;
    } catch (error) {
      if (!request.signal.aborted) modelHint.textContent = `${error.message} 可以手动填写模型 ID。`;
    }
  }

  function scheduleModels() {
    resetModelPicker();
    modelsTimer = setTimeout(refreshModels, 450);
  }

  // A provider is "owned" once it has a saved key (custom APIs may need no key: a saved address and model is enough).
  const isOwned = item => item.hasApiKey || (item.id === "custom" && item.hasSavedModel && Boolean(item.baseUrl));
  const modelLists = {};  // provider id → [{id, name}] from the provider, for the inline model menu
  let editing = null;     // owned provider whose address / key form is open via 修改

  // Close the form without saving: the selection goes back to the provider in use.
  function closeForm() {
    editing = null;
    showMessage("");
    form.elements.engine.value = activeValue(savedSettings);
    updateProvider();
  }

  function activeValue(settings) {
    return settings.engine === "api" ? settings.provider : "local";
  }

  // The address / key / model form appears only when something has to be filled in:
  // a provider you don't own yet, or an owned one you chose to 修改.
  function updateProvider() {
    const selected = form.elements.engine.value;
    provider = savedSettings.providers.find(item => item.id === selected);
    const showForm = Boolean(provider) && (!isOwned(provider) || editing === provider.id);
    const formBox = $("#providerForm");
    formBox.hidden = !showForm;
    $("#cancelEdit").hidden = !showForm;
    $$(".provider-option").forEach(row => row.classList.toggle("open", showForm && row.dataset.id === selected));
    for (const input of $$("#apiFields input")) input.disabled = !showForm;
    if (showForm) {
      $(`.provider-option[data-id="${selected}"]`)?.after(formBox);
      baseUrl.value = provider.baseUrl;
      committedAddress = normalizeAddress(baseUrl.value);
      model.value = provider.model;
      keepModel = provider.hasSavedModel;
      apiKey.value = "";
      clearKey.checked = false;
      $("#removeKey").hidden = !provider.hasApiKey;
      $("#keyHint").textContent = provider.hasApiKey
        ? "此服务商的密钥已保存。沿用相同地址时，留空即可继续使用。"
        : "密钥保存在这台电脑上。";
      const consoleLink = $("#providerConsole");
      consoleLink.hidden = !provider.console;
      if (provider.console) consoleLink.href = provider.console;
      refreshModels();
    } else {
      resetModelPicker();
    }
  }

  function modelLabel({id, name}) {
    if (!name) return id;
    const pretty = name.replace(/[-_]+/g, " ");  // "DeepSeek-V4-Pro" → "DeepSeek V4 Pro"
    return name.toLowerCase() === id.toLowerCase() ? pretty : `${pretty} · ${id}`;
  }

  function fillModelMenu(select, item) {
    const models = [...(modelLists[item.id] || [])];
    if (item.model && !models.some(m => m.id === item.model)) models.unshift({id: item.model, name: ""});
    select.replaceChildren(...models.map(m => new Option(modelLabel(m), m.id)));
    select.value = item.model;
  }

  async function loadModelList(item, select) {
    if (modelLists[item.id]) return;
    try {
      const {models} = await api("/api/settings/models", {method: "POST", body: {provider: item.id, baseUrl: item.baseUrl}});
      modelLists[item.id] = models;
      if (select.isConnected) fillModelMenu(select, item);
    } catch { /* keep just the saved model */ }
  }

  // Owned providers and 本地翻译 switch at once, like the picker on the import page.
  async function quickSave(body, label) {
    controls.disabled = true;
    showMessage("正在切换…");
    try {
      render(await api("/api/settings", {method: "POST", body}));
      showMessage(`已切换为 ${label}，将用于下一次翻译。`);
    } catch (error) {
      showMessage(error.message, true);
      render(savedSettings);
    } finally {
      controls.disabled = false;
    }
  }

  function createProviderOption(item) {
    const {id, name} = item;
    const owned = id === "local" || isOwned(item);
    const row = document.createElement("div");
    row.className = "provider-option";
    row.dataset.id = id;
    const main = document.createElement("label");
    main.className = "provider-main";
    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = "engine";
    radio.value = id;
    const title = document.createElement("span");
    title.className = "provider-name";
    title.textContent = name;
    main.append(radio, title);
    row.append(main);
    // The row is a switch: clicking it again while its form is open closes the form.
    main.addEventListener("click", event => {
      const formBox = $("#providerForm");
      if (radio.checked && !formBox.hidden && formBox.previousElementSibling === row) {
        event.preventDefault();
        closeForm();
      }
    });
    if (!owned) {
      const chevron = document.createElement("span");
      chevron.className = "provider-chevron";
      chevron.setAttribute("aria-hidden", "true");
      main.append(chevron);
    }
    if (id === activeValue(savedSettings)) {
      const badge = document.createElement("span");
      badge.className = "provider-badge";
      badge.textContent = "正在使用";
      main.append(badge);
    }
    if (owned && id !== "local") {
      const wrap = document.createElement("span");
      wrap.className = "select-wrap provider-model";
      const select = document.createElement("select");
      select.className = "btn";
      select.setAttribute("aria-label", `${name} 使用的模型`);
      fillModelMenu(select, item);
      select.onchange = () => {
        radio.checked = true;
        quickSave({engine: "api", provider: id, model: select.value}, select.selectedOptions[0].text.split(" · ")[0]);
      };
      wrap.append(select);
      const edit = document.createElement("button");
      edit.type = "button";
      edit.className = "btn ghost provider-edit";
      edit.textContent = "修改";
      edit.title = "修改地址或 API Key";
      edit.onclick = () => {
        editing = editing === id ? null : id;
        radio.checked = true;
        showMessage("");
        updateProvider();
      };
      row.append(wrap, edit);
      loadModelList(item, select);
    }
    return row;
  }

  function render(settings) {
    savedSettings = settings;
    editing = null;
    controls.append($("#providerForm"));  // park the form before rebuilding the rows
    const owned = settings.providers.filter(isOwned);
    const others = settings.providers.filter(item => !isOwned(item));
    ownedProviders.replaceChildren(...owned.map(createProviderOption), createProviderOption({id: "local", name: "本地翻译（离线）"}));
    otherProviders.replaceChildren(...others.map(createProviderOption));
    otherProviders.closest(".provider-box").hidden = !others.length;
    form.elements.engine.value = activeValue(settings);
    updateProvider();
  }

  async function submit(test) {
    if (controls.disabled || !form.reportValidity()) return;
    const selection = form.elements.engine.value;
    const body = {engine: selection === "local" ? "local" : "api"};
    if (body.engine === "api") {
      if (!model.value.trim()) {
        showMessage("请选择或填写模型名称。", true);
        (model.hidden ? modelSelect : model).focus();
        return;
      }
      body.provider = selection;
      body.baseUrl = baseUrl.value;
      body.model = model.value;
      body.apiKey = apiKey.value;
      body.clearKey = !test && clearKey.checked;
    }
    controls.disabled = true;
    showMessage(test ? "正在测试连接…" : "正在保存…");
    try {
      const settings = await api(test ? "/api/settings/test" : "/api/settings", {method: "POST", body});
      if (!test) render(settings);  // a newly saved provider moves to 已拥有 and the form closes
      showMessage(test ? "连接成功，可以保存设置。" : "设置已保存，将用于下一次翻译。");
    } catch (error) {
      showMessage(error.message, true);
    } finally {
      controls.disabled = false;
    }
  }

  baseUrl.oninput = () => {
    const address = normalizeAddress(baseUrl.value);
    if (address !== committedAddress) apiKey.value = "";
    committedAddress = address;
    scheduleModels();
  };
  apiKey.oninput = scheduleModels;
  clearKey.onchange = refreshModels;
  model.oninput = () => { keepModel = true; };
  modelSelect.onchange = () => {
    keepModel = true;
    showModelInput(!modelSelect.value);
    if (modelSelect.value) {
      model.value = modelSelect.value;
      modelHint.textContent = "";
    } else {
      modelHint.textContent = "填写服务商提供的模型 ID。";
      model.focus();
    }
  };
  providerPicker.onchange = event => {
    if (event.target.name !== "engine") return;  // the inline model menus save on their own
    showMessage("");
    editing = null;
    const choice = event.target.value;
    const item = savedSettings.providers.find(entry => entry.id === choice);
    if (choice === "local") return quickSave({engine: "local"}, "本地翻译");
    if (item && isOwned(item)) return quickSave({engine: "api", provider: choice, model: item.model}, item.name);
    updateProvider();  // not owned yet: open the form under this row
  };
  $("#cancelEdit").onclick = closeForm;
  $("#testApi").onclick = () => submit(true);
  form.onsubmit = event => { event.preventDefault(); submit(false); };
  api("/api/settings").then(settings => {
    render(settings);
    controls.disabled = false;
  }).catch(error => showMessage(error.message, true));
}

// ---------- 语音识别: local model size, cloud recognition
if ($("#asrEngine")) {
  const SIZE_LABEL = { base: "基础模型", small: "小模型", medium: "中模型", large: "大模型" };

  const SHORT = { base: "基础", small: "小", medium: "中", large: "大" };

    const d = l.download;

      : d.status === "error" ? `下载失败：${d.error}`
      : l.gpu ? "这台电脑能快速运行大模型。选「自动」时先用小模型，大模型在后台下载好后自动换上"
      : "这台电脑没有可用的显卡，「自动」用小模型；想更准可以选中模型，识别会慢一些";
    const target = s.model === "auto" ? l.target : s.model;
    $("#asrDownload").hidden = l.sizes[target].downloaded || d.status === "downloading";
    $("#asrDownload").dataset.size = target;
    $("#asrSizes").innerHTML = Object.entries(l.sizes).map(([k, v]) =>
      `<span class="${v.downloaded ? "ok" : ""}">${SHORT[k]} · ${v.mb >= 1000 ? (v.mb / 1000).toFixed(1) + " GB" : v.mb + " MB"} · ${v.downloaded ? "已下载" : "未下载"}</span>`).join("");
    $("#cloudForm").hidden = s.engine !== "cloud" && !editingCloud;

    const same = p.id === asr.provider;

    $("#cloudModel").value = same ? asr.cloudModel : p.model;
    $("#cloudKey").value = "";

    $("#cloudConsole").hidden = !p.console;
    $("#cloudConsole").href = p.console || "#";
  };
  const load = () => api("/api/asr").then(render).catch(e => status(e.message, true));
  const save = async body => {
    try { render(await api("/api/asr", { method: "POST", body })); status("已保存"); return true; }
    catch (e) { status(e.message, true); return false; }
  };
  $("#asrModel").onchange = () => save({ model: $("#asrModel").value });
  $("#asrEngine").onchange = async () => {
    if ($("#asrEngine").value === "cloud") {
      const p = asr.providers.find(x => x.id === asr.provider);
      if (!p.hasKey) { editingCloud = true; $("#cloudForm").hidden = false; status("填写云端服务商的 API Key 后保存。"); return; }
    }
    editingCloud = false;
    save({ engine: $("#asrEngine").value });

  $("#cloudForm").onsubmit = async e => {
    e.preventDefault();
    if (await save({ engine: "cloud", provider: $("#cloudProvider").value, baseUrl: $("#cloudUrl").value,
      cloudModel: $("#cloudModel").value, apiKey: $("#cloudKey").value })) editingCloud = false;
  };
  load();
}

if ($("#lanSwitch")) {
  const show = s => {
    $("#lanSwitch").checked = s.lan;
    $("#lanRestart").hidden = !s.needsRestart;
    $("#lanBox").hidden = !(s.lan && s.running && s.url);
    if (s.lan && s.running && s.url) {
      $("#lanUrl").textContent = s.url;
      $("#lanQr").src = `/api/network/qr.svg?t=${Date.now()}`;
      $("#lanOthers").hidden = !s.others.length;
      $("#lanOthers").textContent = `手机打不开时，把地址里的 ${s.ip} 换成：${s.others.map(u => new URL(u).hostname).join("、")}`;
    }
    $("#lanStatus").textContent = s.lan && !s.ip ? "没有找到这台电脑的局域网地址，请确认已经连上 Wi-Fi。" : "";
  };
  const load = () => api("/api/network").then(show).catch(e => { $("#lanStatus").textContent = e.message; });
  $("#lanSwitch").onchange = async () => show(await api("/api/network", { method: "POST", body: { lan: $("#lanSwitch").checked } }));
  $("#lanNewKey").onclick = async () => {
    if (!await confirmDialog("换一个访问密钥吗？", { detail: "已经扫过码的手机需要重新扫码。" })) return;
    show(await api("/api/network", { method: "POST", body: { lan: true, newKey: true } }));
  };
  $("#lanRestartBtn").onclick = async () => {
    $("#lanRestartBtn").disabled = true;
    await api("/api/restart", { method: "POST" }).catch(() => {});
    for (let i = 0; i < 40; i++) {
      await new Promise(r => setTimeout(r, 500));
      try { await api("/api/version"); break; } catch { /* still restarting */ }
    }
    $("#lanRestartBtn").disabled = false;
    load();
  };
  load();
}

// ---------- 备份
if ($("#backupFolder")) {
  const status = (msg, err) => { $("#backupStatus").textContent = msg; $("#backupStatus").classList.toggle("err", !!err); };
  const show = s => {
    $("#backupFolder").value = s.folder;
    $("#backupKeep").value = s.keep;
    $("#backupLast").textContent = s.lastError ? `上次自动备份失败：${s.lastError}`
      : s.last ? `上次备份：${new Date(s.last * 1000).toLocaleString()}${s.files.length ? ` · 文件夹里有 ${s.files.length} 份` : ""}` : "还没有自动备份过。";
    $("#backupSuggest").innerHTML = s.suggestions.length ? `<span class="muted">这台电脑上的同步文件夹：</span>` +
      s.suggestions.map(x => `<button type="button" class="btn" data-path="${esc(x.path)}">${esc(x.label)}</button>`).join("") : "";
  };
  const load = () => api("/api/backup").then(show).catch(e => status(e.message, true));
  $("#withVideos").onchange = () => { $("#exportBtn").href = `/api/backup/export${$("#withVideos").checked ? "?videos=1" : ""}`; };
  $("#backupSuggest").onclick = e => { const b = e.target.closest("[data-path]"); if (b) $("#backupFolder").value = b.dataset.path; };
  $("#autoForm").onsubmit = async e => {
    e.preventDefault();
    const folder = $("#backupFolder").value.trim();
    try {
      show(await api("/api/backup/settings", { method: "POST", body: { folder, keep: Number($("#backupKeep").value) || 10 } }));
      status(folder ? "已保存。每天会自动备份一次。" : "已关闭自动备份。");
    } catch (err) {
      if (folder && err.status === 404 && await confirmDialog("这个文件夹还不存在，要新建吗？", { detail: folder })) {
        try { await api("/api/backup/mkdir", { method: "POST", body: { folder } }); return $("#autoForm").requestSubmit(); }
        catch (e2) { return status(e2.message, true); }
      }
      status(err.message, true);
    }
  };
  $("#backupNow").onclick = async () => {
    $("#backupNow").disabled = true;
    status("正在备份…");
    try { show(await api("/api/backup/now", { method: "POST" })); status("备份好了。"); }
    catch (e) { status(e.message, true); }
    finally { $("#backupNow").disabled = false; }
  };
  $("#restoreBtn").onclick = () => $("#restoreFile").click();
  $("#restoreFile").onchange = async () => {
    const file = $("#restoreFile").files[0];
    $("#restoreFile").value = "";
    if (!file) return;
    if (!await confirmDialog(`用「${file.name}」恢复吗？`, { detail: "备份里的文件会替换现在的同名文件，被替换的文件会先另存到 data/backups 文件夹。", ok: "恢复" })) return;
    status("正在恢复…");
    try {
      const r = await fetch("/api/backup/import", { method: "POST", headers: { "content-type": "application/zip" }, body: file });
      const out = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(out.error || `请求失败 ${r.status}`);
      status(`已恢复 ${out.restored} 个文件${out.keptAside ? `，原来的 ${out.keptAside} 个文件另存在 ${out.asideFolder}` : ""}。刷新页面就能看到。`);
    } catch (e) { status(e.message, true); }
  };
  load();
}
</script>
</body>
</html>
